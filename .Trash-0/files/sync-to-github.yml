# 同步到 GitHub：任意分支 push 触发，将本仓库代码同步到 GitHub 构建仓库
"**":
  push:
    - imports:
        - https://cnb.cool/myqfeng/keys/-/blob/main/github.yml
      stages:
        - name: 同步代码到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/easytier/easytier-esp.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            sync_mode: push
            force: true
            push_tags: true
